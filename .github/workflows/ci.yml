name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant if the runner image lacks it
        run: command -v ant >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ant)

      - name: Build and run the test suite
        run: ant test
