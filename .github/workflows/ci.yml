name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ hashFiles('builder/Tasks.java') }}

      - name: Check formatting (google-java-format, AOSP style)
        run: ./bld format-check

      - name: Build and run the test suite
        run: ./bld test

      - name: SpotBugs (fails on high-priority findings)
        run: ./bld spotbugs
